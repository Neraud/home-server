watchers:
  - type: docker_registry
    repo: ghcr.io
    image: stakater/reloader
    tag: v1.4.22
    includes:
      - v[0-9]+\.[0-9]+\.[0-9]+
    excludes:
      - .*(PR-|SNAPSHOT|dev|-ubi|-UBI).*
      - v0\.
      - v1\.[0-3]\.
      - v1\.4\.[0-9]$
      - v1\.4\.1[0-9]$
      - v1\.4\.2[0-1]$
